[project]
name = "kate-fit-notes"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "pyTelegramBotAPI==4.7.1",
  "psycopg2-binary==2.9.12",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "alembic==1.14.1",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
